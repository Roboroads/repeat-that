[package]
name = "repeat-that"
description = "Repeat That desktop app: tray, settings window and global hotkeys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Not `repeat_that`: a library and a binary with the same name collide on Windows.
name = "repeat_that_lib"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.23"
png = "0.18"
rt-capture = { path = "../../crates/rt-capture" }
rt-core = { path = "../../crates/rt-core" }
rt-engine = { path = "../../crates/rt-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"

# The Wayland hotkey backend and the session checks talk to the XDG desktop portals and the session bus. Both crates are
# MIT. `zbus` is in the tree already (single-instance, opener) and runs on async-io; ashpd follows it instead of
# starting a second async runtime.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background", "global_shortcuts"] }
futures-util = "0.3"
zbus = "5"
# The openers it tries for a link (xdg-open, gio open, ...), started from an AppImage with the host's environment
# (host_env.rs). MIT, and in the tree already through the opener plugin.
open = "5"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
