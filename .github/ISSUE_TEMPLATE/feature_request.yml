name: Feature request
description: Suggest an idea for Repeat that?!
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you'd want this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
