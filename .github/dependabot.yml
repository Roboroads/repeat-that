version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Listed before `cargo`: a dependency joins the first group that matches. `windows` and `windows-core` must move
      # together (`#[implement]` expands to `::windows_core` paths), so they get one PR.
      windows:
        patterns: ["windows", "windows-core"]
      cargo:
        patterns: ["*"]
    ignore:
      # The `windows` crate has no release past 0.62.2 on crates.io (0.100 is unpublished, see
      # microsoft/windows-rs#4867), and windows-core 0.100 does not mix with it. Both stay ignored so Dependabot can't
      # bump one without the other; upgrade them by hand together and drop these two rules once `windows` 0.100 is out.
      # Tracked in https://github.com/Roboroads/repeat-that/issues/28.
      - dependency-name: windows
        versions: [">= 0.100.0"]
      - dependency-name: windows-core
        versions: [">= 0.100.0"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # svelte-check supports TypeScript 5 and 6 only; drop this once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
