name: Build Windows installers

# Builds the Windows x64 installer (the NSIS .exe) and uploads it as the artifact `release-windows-<file name>`. It
# only builds: checking the release, writing SHA256SUMS and attaching files to a release are publish-release.yml's
# job, which calls this workflow (for releases and for its dry runs) and collects every platform's
# `release-<platform>-*` artifacts.
#   * pull_request / workflow_dispatch: a dry run. The installer is a workflow artifact, so a change can be tried on a
#     real Windows PC before it merges, and the job summary shows its checksum.
#   * with a tag (workflow_call from publish-release.yml): builds exactly that release, and fails when the app version
#     doesn't match the tag. A draft release has no tag yet, so a run for a draft gets the commit to build in `sha`.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0. Empty for a dry run.
        type: string
        required: false
        default: ""
      sha:
        description: Commit to build. Needed while the release is a draft, because its tag doesn't exist yet.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0. Empty for a dry run. Nothing is attached to a release.
        type: string
        required: false
        default: ""
      sha:
        description: Commit to build. Needed while the release is a draft, because its tag doesn't exist yet.
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - app/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - release-please-config.json
      - .release-please-manifest.json
      - .github/scripts/check-release-config.py
      - .github/workflows/build-windows.yml
      - .github/workflows/release-please.yml

permissions:
  contents: read

# `github.workflow` is the calling workflow's name in a called workflow, so this run and the one publish-release.yml
# starts for the same pull request don't cancel each other.
concurrency:
  group: build-windows-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap guard that a release bumps every file carrying the version. Dry runs only: a tagged run comes from a
  # release-please run that has already made this check (with --tags).
  release-config:
    name: Release config
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check-release-config.py

  build:
    name: Installers (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check the tag and commit
        if: ${{ inputs.tag }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v0.1.0, got '$TAG'"
            exit 1
          fi
          if [[ -n "$SHA" && ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit hash, got '$SHA'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # A release run builds exactly what is being released: the given commit (a draft has no tag yet), else
          # the tag. Empty on pull requests and dry runs: the event's own commit.
          ref: ${{ inputs.sha || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19' # same as ci.yml: the oldest Node the docs ask for
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Pinned by commit, so the toolchain is chosen with an input instead of the ref.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Builds the frontend (beforeBuildCommand) and the app, then bundles it. No tagName/releaseId: the action only
      # builds, and the file is staged and uploaded below so the release assets have predictable names.
      # The bundle targets come from app/src-tauri/tauri.windows.conf.json (NSIS only); the next step checks that.
      - name: Build installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: app

      # Tauri names its bundles after productName ("Repeat That_0.1.0_x64-setup.exe"). GitHub turns the spaces in
      # release asset names into dots, so rename first and let SHA256SUMS list the name people will download.
      - name: Stage installer
        id: stage
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=target/release/bundle
          nsis=("$bundle"/nsis/*-setup.exe)
          if [[ ${#nsis[@]} -ne 1 ]]; then
            echo "::error::expected exactly one NSIS installer under $bundle"
            find "$bundle" -type f | sort
            exit 1
          fi
          # The NSIS .exe is the only Windows installer. Another installer next to it means the targets in
          # tauri.windows.conf.json were not applied. Other files (logs, signatures, ...) are none of our business.
          extra=$(find "$bundle" -type f \( -name '*.msi' -o -name '*.exe' \) -not -path "$bundle/nsis/*")
          if [[ -n "$extra" ]]; then
            echo "::error::expected only the NSIS installer under $bundle, found another installer"
            echo "$extra"
            exit 1
          fi

          mkdir installers
          name=$(basename "${nsis[0]}")
          installer="${name// /-}"
          cp "${nsis[0]}" "installers/$installer"

          # Name looks like Repeat-That_<version>_x64-setup.exe
          version=$(basename "${nsis[0]}" | cut -d_ -f2)
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match the app version $version; is release-please-config.json bumping every version file?"
            exit 1
          fi
          echo "artifact=release-windows-$installer" >> "$GITHUB_OUTPUT"

          # publish-release.yml writes SHA256SUMS over every platform; this is only for whoever tries the build.
          cd installers
          {
            echo "### Windows installer $version"
            echo
            echo '```'
            ls -l
            echo
            sha256sum --text -- *.exe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact name starts with release-windows- so publish-release.yml picks it up (release-*) and knows the
      # platform. It is a zip holding the one installer; the installer is compressed already, so no compression.
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: installers/*-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
