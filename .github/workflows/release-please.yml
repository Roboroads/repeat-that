name: release-please

on:
  push:
    branches: [main]

# The GITHUB_TOKEN of this workflow only checks out the repository. release-please acts with RELEASE_PLEASE_TOKEN
# (below), and the release job asks for its own write access.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # One run at a time. A run in progress is never cancelled (it could leave a release PR or draft half-made); a
    # waiting run is replaced by a newer one, which is fine as release-please always works from the latest main. It is
    # on this job, not the workflow, so the slow release build below doesn't hold up the next run.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # release-please acts with a personal access token so that CI runs on its PRs; Release token in
      # docs/MAINTAINING.md says why and how to renew it. Fail here when the secret is empty, rather than let the action
      # fall back to GITHUB_TOKEN, and warn when the token is close to its expiry.
      - name: Check the release token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_PLEASE_TOKEN secret is empty. See Release token in docs/MAINTAINING.md."
            exit 1
          fi
          # A token that has an expiry says when, in a response header of every API call.
          expires=$(gh api --include rate_limit | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: *//Ip')
          if [ -n "$expires" ] && end=$(date -d "$expires" +%s); then
            if [ "$end" -le $(( $(date +%s) + 30 * 86400 )) ]; then
              echo "::warning::The release token expires on $expires. See Release token in docs/MAINTAINING.md."
            fi
          fi

      # Fails when a `release-as` pin outlived its release (what --tags adds is described in the script).
      - uses: actions/checkout@v7
      - name: Check the release config
        run: python3 .github/scripts/check-release-config.py --tags

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds every platform and attaches the files when this run created a release; publish-release.yml says why it is
  # called here and not from an `on: release` trigger. The release is a draft ("draft" in release-please-config.json)
  # that the called workflow publishes once the files are attached, so a failed build leaves a draft instead of a
  # public release without files. A draft has no tag yet, hence the commit. `secrets: inherit` because a called
  # workflow only sees the secrets its caller passes, Environment secrets included: without it the update key of
  # updater-signing and, one call further down, the Apple secrets of apple-signing would be empty.
  publish-release:
    name: Publish release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      actions: read # asked for by the late attach job of the called workflow, which a caller must grant even if unused
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
