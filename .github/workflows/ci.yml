name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The desktop app (app/src-tauri) is part of the workspace, so cargo needs the Tauri system libraries and the
      # built frontend (`tauri::generate_context!` embeds app/dist).
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the oldest Node the docs ask for (README, CONTRIBUTING)
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build frontend
        working-directory: app
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # End-to-end test of Windows capture: a virtual audio device (VB-CABLE) and the audio service, which Windows
      # Server runners have turned off.
      - name: Set up audio (Windows)
        if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Start audio service (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service AudioEndpointBuilder -StartupType Automatic
          Set-Service Audiosrv -StartupType Automatic
          Start-Service AudioEndpointBuilder, Audiosrv
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
      - name: Build probe (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p rt-capture --example probe
      - name: Capture test (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p rt-capture --test windows_audio -- --ignored --nocapture
      - name: Engine test (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p rt-engine --test windows_engine -- --ignored --nocapture

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the oldest Node the docs ask for (README, CONTRIBUTING)
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
