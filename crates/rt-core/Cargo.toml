[package]
name = "rt-core"
description = "Platform-independent speech buffering and playback for Repeat that?!"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "models/**", "Cargo.toml"]

[features]
default = ["silero"]
# Silero VAD via ONNX Runtime. Without it only the energy-based VAD is available.
silero = ["dep:ort"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"], optional = true }

[dev-dependencies]
hound = "3.5"
