[package]
name = "rt-capture"
description = "Per-application audio capture backends for Repeat That"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` expands to `::windows_core` paths, so this has to stay on the version `windows` re-exports as
# `windows::core`. Bump both together.
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Same version as cpal's PipeWire host (rt-engine), so both share one libpipewire binding. 0.3.65 is what Debian 12 has.
pipewire = { version = "0.10", features = ["v0_3_65"] }
png = "0.18"

[dev-dependencies]
rt-core = { path = "../rt-core" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The end-to-end test reads volumes and links from `pw-dump`.
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies]
# Same features as above; the end-to-end test reads session volumes on its own.
windows = "0.62"
